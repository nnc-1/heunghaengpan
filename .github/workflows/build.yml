name: build
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE', 'docs/**']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      # 릴리스 파일 이름에 한글이 있으면 GitHub가 default.exe로 바꿔 버려서 영문으로 둠
      - name: exe 이름 정리
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then N="heunghaengpan-${GITHUB_REF_NAME}.exe"; else N="heunghaengpan.exe"; fi
          cp src-tauri/target/release/heunghaengpan.exe "$N"
          echo "EXE=$N" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: heunghaengpan-windows
          path: ${{ env.EXE }}
      - name: 릴리스에 첨부 (v* 태그일 때만)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.EXE }}
